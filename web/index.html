<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPG Window</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div id="hero-name" class="name">Герой</div>
        <div id="hero-lvl" class="sub">Уровень 1 • 0/100 EXP</div>
      </div>
      <div id="hero-gold" class="gold">0 💰</div>
    </header>

    <section class="card">
      <div class="row">
        <span>❤️ HP</span>
        <span id="hero-hp-text">100/100</span>
      </div>
      <div class="bar"><div id="hero-hp-bar" class="fill hp"></div></div>

      <div class="stats">
        <div>🗡 Атака: <strong id="hero-atk">14</strong></div>
        <div>💥 Урон боссам: <strong id="hero-bdmg">0</strong></div>
      </div>
    </section>

    <section class="card boss-card">
      <div class="row">
        <strong id="boss-title">🐉 Босс</strong>
        <span id="boss-hp-text">0/0</span>
      </div>
      <div class="bar"><div id="boss-hp-bar" class="fill boss"></div></div>
      <button id="btn-raid" class="btn danger">💥 Ударить рейд-босса</button>
    </section>

    <section class="actions">
      <button id="btn-hunt" class="btn primary">⚔️ Вылазка</button>
      <button id="btn-atk" class="btn">🗡 +3 Атаки (<span id="up-cost">25</span> 💰)</button>
      <button id="btn-heal" class="btn">🧪 Лечение (15 💰)</button>
      <a id="btn-support" class="btn ghost" href="#" target="_blank">🛠 Баг / Саппорт</a>
    </section>

    <div id="log" class="log">Готов к бою.</div>
  </div>

  <script src="game.js"></script>

<!-- RPG_BLEED_SHATTER_FX_START -->
<style id="rpg-clean-fx">
  #rpg-fx-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99999;
    overflow: hidden;
  }
  .rpg-drop {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #7a0000);
    box-shadow: 0 0 6px rgba(210, 10, 10, 0.9);
    will-change: transform, opacity;
    transition: transform 0.52s cubic-bezier(0.22, 0.8, 0.36, 1), opacity 0.52s ease-out;
  }
  .rpg-chunk {
    position: absolute;
    border-radius: 4px;
    background: linear-gradient(135deg, #d92626 0%, #690e17 65%, #240508 100%);
    border: 1px solid rgba(255, 130, 130, 0.45);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.65);
    will-change: transform, opacity;
    transition: transform 0.78s cubic-bezier(0.16, 0.85, 0.3, 1), opacity 0.78s ease-in;
  }
</style>
<div id="rpg-fx-layer"></div>
<script>
(() => {
  const layer = document.getElementById("rpg-fx-layer");
  let deathLock = false;

  function getEnemyZone() {
    const c = document.querySelector("canvas");
    if (c && c.getBoundingClientRect) {
      const r = c.getBoundingClientRect();
      if (r.width > 40 && r.height > 40) {
        return {
          x: r.left + r.width * 0.5,
          y: r.top + r.height * 0.42,
          w: Math.min(180, r.width * 0.35),
          h: Math.min(160, r.height * 0.35),
          floorY: r.top + r.height * 0.68
        };
      }
    }
    return {
      x: window.innerWidth * 0.5,
      y: window.innerHeight * 0.38,
      w: 140,
      h: 120,
      floorY: window.innerHeight * 0.55
    };
  }

  function bleedAt(cx, cy, count) {
    if (!layer) return;
    const n = count || 8;
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "rpg-drop";
      const sz = 5 + Math.random() * 7;
      d.style.width = sz + "px";
      d.style.height = sz + "px";
      d.style.left = cx + "px";
      d.style.top = cy + "px";
      layer.appendChild(d);

      const ang = Math.random() * Math.PI * 2;
      const dist = 24 + Math.random() * 82;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist + 28;

      requestAnimationFrame(() => {
        d.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) scale(0.45)`;
        d.style.opacity = "0";
      });
      setTimeout(() => d.remove(), 550);
    }
  }

  window.rpgFastBleed = function(x, y) {
    const z = getEnemyZone();
    const bx = (typeof x === "number" && x > 0) ? x : (z.x + (Math.random() - 0.5) * z.w * 0.6);
    const by = (typeof y === "number" && y > 0) ? y : (z.y + (Math.random() - 0.5) * z.h * 0.6);
    bleedAt(bx, by, 8);
  };

  window.rpgShatterEnemy = function() {
    if (deathLock || !layer) return;
    deathLock = true;
    setTimeout(() => { deathLock = false; }, 700);

    const z = getEnemyZone();
    bleedAt(z.x, z.y, 24);

    for (let i = 0; i < 22; i++) {
      const ch = document.createElement("div");
      ch.className = "rpg-chunk";
      const w = 12 + Math.random() * 20;
      const h = 10 + Math.random() * 18;
      const sx = z.x + (Math.random() - 0.5) * z.w;
      const sy = z.y + (Math.random() - 0.5) * z.h;
      ch.style.width = w + "px";
      ch.style.height = h + "px";
      ch.style.left = sx + "px";
      ch.style.top = sy + "px";
      layer.appendChild(ch);

      const dx = (Math.random() - 0.5) * 300;
      const dy = Math.max(25, z.floorY - sy + (Math.random() - 0.5) * 32);
      const rot = (Math.random() - 0.5) * 760;

      requestAnimationFrame(() => {
        ch.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotate(${rot.toFixed(0)}deg) scale(0.65)`;
        ch.style.opacity = "0";
      });
      setTimeout(() => ch.remove(), 800);
    }
  };

  document.addEventListener("pointerdown", function(e) {
    const hitEl = e.target && e.target.closest ? e.target.closest("button, [role='button'], canvas") : null;
    if (hitEl) {
      window.rpgFastBleed(e.clientX, e.clientY);
    }
  }, true);

  const origFetch = window.fetch;
  if (typeof origFetch === "function") {
    window.fetch = async function(...args) {
      const res = await origFetch.apply(this, args);
      try {
        const clone = res.clone();
        const ct = clone.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          const data = await clone.json();
          const hpVal = Number(data?.boss_hp ?? data?.hp ?? data?.enemy_hp ?? NaN);
          const killedFlag = Boolean(data?.killed || data?.dead || (typeof data?.log === "string" && data.log.includes("ДОБИЛ")));
          if (killedFlag || (!Number.isNaN(hpVal) && hpVal <= 0)) {
            window.rpgShatterEnemy();
          } else if (data?.damage || data?.dmg || data?.log) {
            window.rpgFastBleed(0, 0);
          }
        }
      } catch (_) {}
      return res;
    };
  }
})();
</script>
<!-- RPG_BLEED_SHATTER_FX_END -->
</body>
</html>
